    <clipPath id="eyeL"><path d="M326,268 Q350,256 378,262 L376,282 Q352,290 330,282 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M420,262 Q446,255 468,266 L465,284 Q444,291 422,283 Z"/></clipPath>
