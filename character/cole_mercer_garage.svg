    <line x1="-20" y1="90" x2="1040" y2="215" stroke="#2f8cff" stroke-width="16" filter="url(#glow)"/>
    <line x1="-20" y1="90" x2="1040" y2="215" stroke="#9fd6ff" stroke-width="7"/>
    <line x1="-20" y1="90" x2="1040" y2="215" stroke="#ffffff" stroke-width="2"/>
    <line x1="-20" y1="378" x2="300" y2="384" stroke="#1d6dff" stroke-width="26" opacity="0.6" filter="url(#glow)"/>
    <line x1="-20" y1="378" x2="300" y2="384" stroke="#9fd6ff" stroke-width="5"/>
    <line x1="-20" y1="455" x2="240" y2="458" stroke="#1d6dff" stroke-width="18" opacity="0.6" filter="url(#glow)"/>
    <line x1="-20" y1="455" x2="240" y2="458" stroke="#9fd6ff" stroke-width="3"/>
