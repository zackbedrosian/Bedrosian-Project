    <path d="M300,340 L292,280 L272,262 L292,238 L276,190 L304,160 L290,124 L336,122 L350,92 L386,108 L410,78 L436,104 L476,90 L474,124 L512,128 L500,162 L528,190 L504,214 L520,266 L496,256 L498,320 L482,286 L478,232 Z" fill="url(#hair)"/>
